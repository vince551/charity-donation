<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings - Pitch Kings Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-wrapper">
    <aside class="sidebar">
      <h3>Pitch Kings Admin</h3>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="teams.html">Teams</a>
        <a href="players.html">Players</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="standings.html" class="active">Standings</a>
        <a href="referees.html">Referees</a>
        <a href="users.html">Users</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
      </nav>
      <button id="logoutBtn">Logout</button>
    </aside>

    <main class="content">
      <header>
        <h1>League Table Standings</h1>
      </header>

      <table class="data-table" style="margin-top: 20px;">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Team</th>
            <th>P</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>GD</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody id="standingsList">
          </tbody>
      </table>
    </main>
  </div>

  <script type="module">
    import { checkAuth, logoutUser } from '../js/auth.js';
    import { loadStandings } from '../js/standings.js';

    checkAuth('admin');
    document.getElementById('logoutBtn').addEventListener('click', logoutUser);
    document.addEventListener('DOMContentLoaded', () => loadStandings('standingsList'));
  </script>
</body>
</html>
