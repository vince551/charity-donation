<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams - Pitch Kings Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-wrapper">
    <aside class="sidebar">
      <h3>Pitch Kings Admin</h3>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="teams.html" class="active">Teams</a>
        <a href="players.html">Players</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="standings.html">Standings</a>
        <a href="referees.html">Referees</a>
        <a href="users.html">Users</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
      </nav>
      <button id="logoutBtn">Logout</button>
    </aside>

    <main class="content">
      <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Registered Teams</h1>
        <button class="btn-primary">Add Team</button>
      </header>

      <table class="data-table" style="margin-top: 20px;">
        <thead>
          <tr>
            <th>Team Name</th>
            <th>Manager</th>
            <th>Players</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="teamsList">
          <tr><td colspan="4">Loading teams...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <script type="module">
    import { checkAuth, logoutUser } from '../js/auth.js';
    checkAuth('admin');
    document.getElementById('logoutBtn').addEventListener('click', logoutUser);
  </script>
</body>
</html>
