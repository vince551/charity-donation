<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixtures - Pitch Kings Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-wrapper">
    <aside class="sidebar">
      <h3>Pitch Kings Admin</h3>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="teams.html">Teams</a>
        <a href="players.html">Players</a>
        <a href="fixtures.html" class="active">Fixtures</a>
        <a href="standings.html">Standings</a>
        <a href="referees.html">Referees</a>
        <a href="users.html">Users</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
      </nav>
      <button id="logoutBtn">Logout</button>
    </aside>

    <main class="content">
      <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Fixtures & Results</h1>
        <button class="btn-primary" id="addFixtureBtn">New Fixture</button>
      </header>

      <div id="fixturesList" style="margin-top: 20px; display: grid; gap: 15px;">
        </div>
    </main>
  </div>

  <script type="module">
    import { checkAuth, logoutUser } from '../js/auth.js';
    import { loadFixtures } from '../js/fixtures.js';

    checkAuth('admin');
    document.getElementById('logoutBtn').addEventListener('click', logoutUser);
    document.addEventListener('DOMContentLoaded', () => loadFixtures('fixturesList'));
  </script>
</body>
</html>
